
<style>
*{box-sizing:border-box;margin:0;padding:0}
.wrap{padding:8px 0;font-size:13px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.fp{padding:4px 12px;border-radius:16px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid var(--color-border-secondary);color:var(--color-text-secondary);background:var(--color-background-secondary);transition:all .15s;user-select:none}
.fp.on{border-color:transparent}
.fp[data-g="ALL"].on{background:#378ADD;color:#042C53}
.fp[data-g="Auth"].on{background:#9FE1CB;color:#04342C}
.fp[data-g="Hospitals"].on{background:#AFA9EC;color:#26215C}
.fp[data-g="Beds"].on{background:#B5D4F4;color:#042C53}
.fp[data-g="Patients"].on{background:#FAC775;color:#412402}
.fp[data-g="Ambulances"].on{background:#F5C4B3;color:#4A1B0C}
.fp[data-g="Supervisor"].on{background:#F7C1C1;color:#501313}
.fp[data-g="Analytics"].on{background:#C0DD97;color:#173404}
.fp[data-g="AI Calls"].on{background:#D3D1C7;color:#2C2C2A}
@media(prefers-color-scheme:dark){
.fp[data-g="ALL"].on{background:#185FA5;color:#B5D4F4}
.fp[data-g="Auth"].on{background:#085041;color:#9FE1CB}
.fp[data-g="Hospitals"].on{background:#3C3489;color:#CECBF6}
.fp[data-g="Beds"].on{background:#0C447C;color:#B5D4F4}
.fp[data-g="Patients"].on{background:#633806;color:#FAC775}
.fp[data-g="Ambulances"].on{background:#712B13;color:#F5C4B3}
.fp[data-g="Supervisor"].on{background:#791F1F;color:#F7C1C1}
.fp[data-g="Analytics"].on{background:#27500A;color:#C0DD97}
.fp[data-g="AI Calls"].on{background:#444441;color:#D3D1C7}
}
.search{width:100%;padding:7px 12px;border:1px solid var(--color-border-secondary);border-radius:8px;font-size:12px;background:var(--color-background-secondary);color:var(--color-text-primary);margin-bottom:12px;outline:none}
.search:focus{border-color:var(--color-border-primary)}
.group-hdr{font-size:11px;font-weight:500;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.06em;padding:10px 0 4px;border-bottom:1px solid var(--color-border-tertiary);margin-bottom:6px}
.api-row{display:grid;grid-template-columns:54px 1fr 90px;gap:8px;align-items:start;padding:7px 10px;border-radius:6px;margin-bottom:2px;cursor:pointer;border:1px solid transparent;transition:background .12s}
.api-row:hover{background:var(--color-background-secondary)}
.api-row.open{background:var(--color-background-secondary);border-color:var(--color-border-tertiary);border-radius:8px 8px 0 0;margin-bottom:0}
.method{padding:2px 0;border-radius:4px;font-size:10px;font-weight:700;text-align:center}
.m-GET{background:#E1F5EE;color:#085041}.m-POST{background:#E6F1FB;color:#0C447C}
.m-PATCH{background:#FAEEDA;color:#633806}.m-DELETE{background:#FCEBEB;color:#791F1F}
@media(prefers-color-scheme:dark){
.m-GET{background:#085041;color:#9FE1CB}.m-POST{background:#0C447C;color:#B5D4F4}
.m-PATCH{background:#633806;color:#FAC775}.m-DELETE{background:#791F1F;color:#F7C1C1}
}
.api-url{font-family:monospace;font-size:11.5px;color:var(--color-text-primary);word-break:break-all;line-height:1.5}
.api-url .param{color:#1D9E75}
.api-auth{font-size:10px;color:var(--color-text-secondary);text-align:right;white-space:nowrap}
.api-detail{display:none;padding:8px 12px 12px;border:1px solid var(--color-border-tertiary);border-top:none;border-radius:0 0 8px 8px;background:var(--color-background-secondary);margin-bottom:8px}
.api-detail.show{display:block}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.detail-grid{grid-template-columns:1fr}}
.dl{font-size:10px;font-weight:500;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.code{background:var(--color-background-tertiary);border:1px solid var(--color-border-tertiary);border-radius:5px;padding:8px 10px;font-family:monospace;font-size:11px;color:var(--color-text-primary);white-space:pre-wrap;line-height:1.6;max-height:200px;overflow-y:auto}
.desc{font-size:12px;color:var(--color-text-secondary);line-height:1.6;margin-bottom:8px}
.badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:500;margin-right:4px}
.b-pub{background:#E1F5EE;color:#085041}.b-auth{background:#EEEDFE;color:#3C3489}.b-role{background:#FAEEDA;color:#633806}
@media(prefers-color-scheme:dark){.b-pub{background:#085041;color:#9FE1CB}.b-auth{background:#3C3489;color:#CECBF6}.b-role{background:#633806;color:#FAC775}}
.count{font-size:11px;color:var(--color-text-secondary);margin-bottom:10px}
</style>

<div class="wrap">
<input class="search" id="srch" placeholder="Search endpoint, method, or keyword..." oninput="filter()">
<div class="filters" id="fbar"></div>
<div class="count" id="cnt"></div>
<div id="list"></div>
</div>

const groups = ["ALL","Auth","Hospitals","Beds","Patients","Ambulances","Supervisor","Analytics","AI Calls"];
let activeG = "ALL", openId = null;

function render(){
  const q = document.getElementById('srch').value.toLowerCase();
  const list = document.getElementById('list');
  list.innerHTML = '';

  let shown = 0;
  const byGroup = {};
  data.forEach((ep, i) => {
    if(activeG !== "ALL" && ep.g !== activeG) return;
    if(q && !ep.url.toLowerCase().includes(q) && !ep.m.toLowerCase().includes(q) && !ep.desc.toLowerCase().includes(q) && !ep.g.toLowerCase().includes(q)) return;
    if(!byGroup[ep.g]) byGroup[ep.g] = [];
    byGroup[ep.g].push({ep, i});
    shown++;
  });

  document.getElementById('cnt').textContent = shown + ' endpoint' + (shown===1?'':'s') + ' shown';

  Object.entries(byGroup).forEach(([grp, items]) => {
    const gh = document.createElement('div');
    gh.className = 'group-hdr';
    gh.textContent = grp;
    list.appendChild(gh);

    items.forEach(({ep, i}) => {
      const row = document.createElement('div');
      row.className = 'api-row' + (openId===i?' open':'');
      row.innerHTML = `
        <span class="method m-${ep.m}">${ep.m}</span>
        <span class="api-url">${ep.url.replace(/:[a-z_]+/g, m=>`<span class="param">${m}</span>`)}</span>
        <span class="api-auth"><span class="badge ${ep.auth==='Public'?'b-pub':ep.auth==='Twilio'?'b-pub':'b-role'}">${ep.auth}</span></span>
      `;
      row.onclick = () => { openId = openId===i ? null : i; render(); };
      list.appendChild(row);

      if(openId === i){
        const detail = document.createElement('div');
        detail.className = 'api-detail show';
        detail.innerHTML = `
          <p class="desc">${ep.desc}</p>
          <div class="detail-grid">
            <div><div class="dl">Request body / params</div><div class="code">${ep.body}</div></div>
            <div><div class="dl">Response example</div><div class="code">${ep.res}</div></div>
          </div>
        `;
        list.appendChild(detail);
      }
    });
  });
}

function filter(){ render(); }

// build filter pills
const fbar = document.getElementById('fbar');
groups.forEach(g => {
  const p = document.createElement('span');
  p.className = 'fp' + (g==='ALL'?' on':'');
  p.dataset.g = g;
  p.textContent = g === 'ALL' ? 'All groups' : g;
  p.onclick = () => {
    activeG = g;
    document.querySelectorAll('.fp').forEach(x => x.classList.remove('on'));
    p.classList.add('on');
    openId = null;
    render();
  };
  fbar.appendChild(p);
});

render();
</script>
